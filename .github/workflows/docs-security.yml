name: Documentation Security CI

on:
  push:
    branches: [dev, beta, main]
  pull_request:
    branches: [dev, beta, main]

permissions:
  contents: read

jobs:
  security:
    name: docs-security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 pinned
        with:
          node-version: '22'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4 pinned
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}
      - name: Dependency security audit
        run: |
          npm install --no-fund --no-audit
          npm audit --audit-level=high
      - name: Sensitive-content pattern scan
        run: npm run test:security
      - name: Credential history scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2 pinned
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
