name: Documentation CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  build:
    name: docs-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 pinned
        with:
          node-version: '22'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4 pinned
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}
      - name: Prepare free offline German translation
        run: |
          python3 -m venv .translate-env
          .translate-env/bin/python -m pip install --disable-pip-version-check --quiet argostranslate==1.11.0
          .translate-env/bin/python scripts/setup_translation.py
      - name: Install dependencies
        run: npm ci --no-fund --no-audit
      - name: Markdown, language parity and links
        run: npm run test:docs
      - name: Astro diagnostics
        run: npm run check
      - name: Build static website
        run: npm run build
      - name: Check generated routes, language pairs and images
        run: npm run test:links
      - name: Validate workflow permissions and release gates
        run: npm run test:workflows
      - name: Headless browser checks (desktop and mobile)
        run: npm run test:browser
      - name: Detect source code and docs drift
        run: |
          git clone --depth 1 --branch main https://github.com/VeiglbergTech/OpenSigWeave.git "$RUNNER_TEMP/OpenSigWeave"
          node scripts/verify-source.mjs "$RUNNER_TEMP/OpenSigWeave"
