name: Documentation branch promotion policy

on:
  pull_request:
    branches: [beta, main]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  actions: read

jobs:
  policy:
    name: docs-promotion-policy
    runs-on: ubuntu-latest
    steps:
      - name: Enforce dev -> beta -> main and successful source checks
        shell: bash
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
          TARGET_BRANCH: ${{ github.base_ref }}
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_REPOSITORY" == "$GH_REPO" ]] || { echo "::error::Cross-repository promotion is forbidden"; exit 1; }
          case "$TARGET_BRANCH:$SOURCE_BRANCH" in
            beta:dev|main:beta) ;;
            *) echo "::error::Only dev -> beta or beta -> main permitted"; exit 1 ;;
          esac
          latest="$(gh api "repos/$GH_REPO/branches/$SOURCE_BRANCH" --jq '.commit.sha')"
          [[ "$latest" == "$SOURCE_SHA" ]] || { echo "::error::Source branch moved"; exit 1; }
          # Pull-request policy and push CI run concurrently. Poll for the source
          # branch's exact-SHA push checks instead of failing while they are queued.
          # Never treat missing, cancelled or failed checks as approval.
          check_workflow() {
            local workflow="$1"
            jq -r --arg p ".github/workflows/$workflow" '
              [.workflow_runs[] | select(.path == $p)] as $found |
              if ($found | length) == 0 then "pending"
              elif any($found[]; .status == "completed" and .conclusion != "success") then "failed"
              elif all($found[]; .status == "completed" and .conclusion == "success") then "passed"
              else "pending"
              end
            ' <<< "$response"
          }
          for attempt in {1..24}; do
            response="$(gh api "repos/$GH_REPO/actions/runs?branch=$SOURCE_BRANCH&head_sha=$SOURCE_SHA&event=push&per_page=100")"
            ci="$(check_workflow docs-ci.yml)"
            security="$(check_workflow docs-security.yml)"
            if [[ "$ci" == "failed" || "$security" == "failed" ]]; then
              echo "::error::Source $SOURCE_BRANCH@$SOURCE_SHA has failed push checks (CI=$ci, security=$security)"
              exit 1
            fi
            if [[ "$ci" == "passed" && "$security" == "passed" ]]; then
              echo "Successful source push checks confirmed on attempt $attempt"
              break
            fi
            if (( attempt == 24 )); then
              echo "::error::Timed out waiting for exact-SHA push checks (CI=$ci, security=$security)"
              exit 1
            fi
            sleep 5
          done
          echo "CI source gate verified; human review and beta acceptance remain required by GitHub rulesets."
